<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$10,000 Investment Challenge | Easy Mode</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#16263a;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#123c5a;color:white;padding:17px 20px}header strong{font-size:20px}header small{display:block;color:#d9eaf5}main{max-width:750px;margin:24px auto;padding:0 15px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.track{height:10px;border-radius:20px;background:#d8e4ec;overflow:hidden;margin:14px 0 24px}.track>div{height:100%;background:#268d79;transition:width .2s}.card{background:white;border:1px solid #dce6ee;border-radius:18px;padding:clamp(20px,5vw,35px);box-shadow:0 4px 18px #123c5a0a}h1{font-size:clamp(24px,5vw,33px);margin:0 0 14px}h2{font-size:20px;margin:25px 0 12px}.intro{font-size:17px;line-height:1.6;color:#354a5e}.question{font-weight:750;font-size:20px;margin:25px 0 15px}.options{display:grid;gap:10px}.option{display:block;width:100%;text-align:left;padding:15px 18px;border:2px solid #d3e0e9;border-radius:12px;background:white;color:#172c3f;font:inherit;cursor:pointer}.option.selected{border-color:#187c76;background:#e9f8f4}.answer{width:100%;padding:14px;border:2px solid #cadbe5;border-radius:12px;font:inherit;font-size:17px;min-height:50px}textarea.answer{min-height:140px;resize:vertical}.help{background:#eff8ff;border-radius:12px;padding:15px;margin-top:16px;line-height:1.6}.math{font-size:23px;font-weight:750;color:#135f70;padding:9px 0}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:28px;flex-wrap:wrap}button{cursor:pointer;font:inherit;font-weight:750;border-radius:11px;padding:12px 20px;border:0}.primary{background:#176d65;color:white}.secondary{background:#e6eef3;color:#173449}.tiny{font-size:13px;color:#587084}.feedback{margin-top:12px;font-weight:650}.ok{color:#176d65}.try{color:#a2581b}.pill{font-size:13px;font-weight:750;color:#176d65;background:#e1f5ed;padding:7px 12px;border-radius:50px}.hidden{display:none}.endtable{width:100%;border-collapse:collapse}.endtable td{padding:10px;border-bottom:1px solid #dde7ed}.endtable td:last-child{text-align:right;font-weight:750}button:focus-visible,.option:focus-visible{outline:3px solid #e6a82e;outline-offset:3px}@media(max-width:450px){.buttons button{flex:1}main{margin:12px auto}}@media print{header,.buttons,.track,.top{display:none}body{background:white}.card{box-shadow:none;border:0}}
</style></head><body><header><strong>💰 The $10,000 Investment Challenge</strong><small>Easy Mode • One question at a time • No time limit</small></header>
<main><div class="top"><span id="count"></span><span class="pill" id="mission"></span></div><div class="track"><div id="progress"></div></div><article class="card" id="screen"></article></main>
<script>
const steps=[{"mission": "start", "title": "Meet your client", "info": "Jasmina is 22. She has $10,000 saved, earns $60,000/year, spends $1,500/month on needs, and wants $3,000 in 18 months. Her employer matches 401(k) contributions up to 3%.", "type": "text", "question": "What is your first name?", "helper": "", "answer": null}, {"mission": "start", "title": "Class information", "info": "Your work saves automatically on this device. At the end, download your report for Google Classroom.", "type": "text", "question": "What class period are you in?", "helper": "", "answer": null}, {"mission": "m1", "title": "Keep money safe", "info": "An emergency fund covers unexpected costs. Jasmina wants 3 months of essential expenses.", "type": "calc", "question": "How much should her emergency fund be?", "helper": "1500 × 3", "answer": 4500}, {"mission": "m1", "title": "Save for a near-term goal", "info": "Jasmina needs $3,000 in 18 months. Stocks can lose value when you need the money.", "type": "choice", "question": "Where should she keep the $3,000?", "helper": ["Savings account", "Single company stock", "Long-term stock fund"], "answer": "Savings account"}, {"mission": "m1", "title": "What's left to invest?", "info": "She starts with $10,000. Set aside $4,500 for emergencies and $3,000 for the purchase.", "type": "calc", "question": "How much is left for long-term investing?", "helper": "10000 − 4500 − 3000", "answer": 2500}, {"mission": "m1", "title": "Why save and invest?", "info": "Savings is useful for near-term needs. Investing can grow over decades, but prices move up and down.", "type": "choice", "question": "Which is the better long-term wealth-building choice?", "helper": ["Investing a diversified portfolio", "Keeping everything in checking"], "answer": "Investing a diversified portfolio"}, {"mission": "m1", "title": "Inflation", "info": "A savings account earns 1%, but prices rise 4%. Your money grows more slowly than prices.", "type": "calc", "question": "About how much purchasing power do you lose? Enter a negative percentage.", "helper": "1 − 4", "answer": -3}, {"mission": "m1", "title": "Compound growth", "info": "Compound growth means you can earn returns on earlier returns. Starting earlier gives growth more time.", "type": "calc", "question": "At 6% annual growth, about how much does $1,000 become after 10 years?", "helper": "1000 × (1.06)^10", "answer": 1791}, {"mission": "m1", "title": "Time matters", "info": "The same $1,000 stays invested for 30 years instead of 10 years.", "type": "calc", "question": "At 6% annual growth, about how much after 30 years?", "helper": "1000 × (1.06)^30", "answer": 5743}, {"mission": "m1", "title": "Explain it", "info": "Use the words 'interest on interest' or 'growth on growth'.", "type": "write", "question": "Why does starting young help retirement savings?", "helper": "Starting young helps because...", "answer": null}, {"mission": "m2", "title": "Stocks and bonds", "info": "A stock is ownership in a company. A bond is a loan to an issuer.", "type": "choice", "question": "Which one represents partial ownership?", "helper": ["Stock", "Bond"], "answer": "Stock"}, {"mission": "m2", "title": "How stocks earn money", "info": "Stocks may pay dividends. You may also profit by selling shares for more than you paid.", "type": "choice", "question": "Which is a possible way to earn money from stocks?", "helper": ["Dividends or price gains", "Guaranteed coupon payments on every stock"], "answer": "Dividends or price gains"}, {"mission": "m2", "title": "Risk and return", "info": "Stocks historically have had higher average returns and bigger price swings than bonds. Higher potential return usually means accepting more risk.", "type": "choice", "question": "Which is generally more volatile?", "helper": ["Stocks", "High-quality bonds"], "answer": "Stocks"}, {"mission": "m2", "title": "Build a mix", "info": "Jasmina has decades until retirement, but dislikes large losses. Diversifying helps spread risk. Neither choice is guaranteed.", "type": "choice", "question": "Choose a sample long-term mix.", "helper": ["80% stock funds / 20% bond funds", "60% stock funds / 40% bond funds", "100% in one company's stock"], "answer": null}, {"mission": "m2", "title": "Explain your mix", "info": "Think about her age, time horizon and comfort with risk.", "type": "write", "question": "Why did you choose that investment mix?", "helper": "I chose this mix because...", "answer": null}, {"mission": "m2", "title": "What is diversification?", "info": "A broad fund owns many investments, reducing the effect of one company's trouble. It cannot prevent all losses.", "type": "choice", "question": "Which is more diversified?", "helper": ["A broad index fund", "One company's stock"], "answer": "A broad index fund"}, {"mission": "m2", "title": "ETFs and index funds", "info": "An ETF can trade during the market day. An index fund aims to track a market index; it may be structured as an ETF or mutual fund.", "type": "choice", "question": "Which statement is true?", "helper": ["ETFs can trade during the day", "All ETFs are one company stock"], "answer": "ETFs can trade during the day"}, {"mission": "m2", "title": "Active vs. passive", "info": "An active fund manager selects investments. An index fund tracks an index. Active funds often cost more.", "type": "choice", "question": "Which usually has lower fees?", "helper": ["Broad passive index fund", "Actively managed fund"], "answer": "Broad passive index fund"}, {"mission": "m2", "title": "Compare fees", "info": "Fund A earns 7.0% before a 1.0% fee. Fund B earns 6.5% before a 0.1% fee.", "type": "calc", "question": "What is Fund A's approximate return after fees (%)?", "helper": "7 − 1", "answer": 6}, {"mission": "m2", "title": "Compare fees again", "info": "Fund B earns 6.5% before a 0.1% fee.", "type": "calc", "question": "What is Fund B's approximate return after fees (%)?", "helper": "6.5 − 0.1", "answer": 6.4}, {"mission": "m2", "title": "Choose the better net return", "info": "Compare the two after-fee returns: A is 6.0%; B is 6.4%.", "type": "choice", "question": "Which has the higher net return?", "helper": ["Fund A", "Fund B"], "answer": "Fund B"}, {"mission": "m2", "title": "Share price vs. company value", "info": "A share costs $40 at one company and $400 at another. Market cap = share price × number of shares.", "type": "choice", "question": "Can price alone tell which company is worth more?", "helper": ["No, we need shares outstanding too", "Yes, the $400 company is worth more"], "answer": "No, we need shares outstanding too"}, {"mission": "m2", "title": "Why prices move", "info": "Earnings, competition, economic news and investor expectations can change a company's stock price.", "type": "write", "question": "Name TWO things that can change a stock price.", "helper": "One factor is... Another factor is...", "answer": null}, {"mission": "m3", "title": "Bull or bear?", "info": "Bull markets generally rise. Bear markets generally fall.", "type": "choice", "question": "A market that has fallen sharply over time is called...", "helper": ["Bear market", "Bull market"], "answer": "Bear market"}, {"mission": "m3", "title": "Market crash!", "info": "Jasmina's long-term investments fall 20%. Her friends are panic-selling. She still has decades before retirement.", "type": "choice", "question": "What is the most thoughtful first step?", "helper": ["Review goals, risk and diversification", "Sell only because friends are selling", "Assume all losses are permanent"], "answer": "Review goals, risk and diversification"}, {"mission": "m3", "title": "Explain the decision", "info": "Investing decisions should reflect your needs, not just headlines.", "type": "write", "question": "What would you tell Jasmina during the crash?", "helper": "I would tell Jasmina...", "answer": null}, {"mission": "m3", "title": "Stock math: cost", "info": "You buy 10 shares at $45 each.", "type": "calc", "question": "What is your total purchase cost ($)?", "helper": "10 × 45", "answer": 450}, {"mission": "m3", "title": "Stock math: sale", "info": "You sell those 10 shares for $80 each.", "type": "calc", "question": "What is the total sale amount ($)?", "helper": "10 × 80", "answer": 800}, {"mission": "m3", "title": "Stock math: profit", "info": "Ignore fees and dividends for this example.", "type": "calc", "question": "What is your profit ($)?", "helper": "800 − 450", "answer": 350}, {"mission": "m3", "title": "Bond interest rates", "info": "You own a fixed 5% bond. New comparable bonds now pay 3%. Your older bond's rate looks attractive.", "type": "choice", "question": "What generally happens to your bond's market price?", "helper": ["It rises", "It falls", "It must stay the same"], "answer": "It rises"}, {"mission": "m3", "title": "Company-specific risk", "info": "One company falls 35% after bad news while the broad market falls only 3%.", "type": "choice", "question": "What lesson does this show?", "helper": ["Owning one company can be risky", "Diversification guarantees profits"], "answer": "Owning one company can be risky"}, {"mission": "m4", "title": "401(k) employer match", "info": "Jasmina earns $60,000. Her employer matches dollar-for-dollar up to 3% of salary.", "type": "calc", "question": "How much must she contribute per year to get the full match ($)?", "helper": "60000 × 0.03", "answer": 1800}, {"mission": "m4", "title": "Monthly 401(k) amount", "info": "Her yearly contribution target is $1,800.", "type": "calc", "question": "How much is that per month ($)?", "helper": "1800 ÷ 12", "answer": 150}, {"mission": "m4", "title": "Employer money", "info": "Her employer matches the $1,800 yearly contribution under this example.", "type": "calc", "question": "How much does the employer add per year ($)?", "helper": "1800", "answer": 1800}, {"mission": "m4", "title": "Monthly budget", "info": "Jasmina can invest $250 each month. She puts $150 into her 401(k).", "type": "calc", "question": "How much monthly money remains ($)?", "helper": "250 − 150", "answer": 100}, {"mission": "m4", "title": "Where to invest", "info": "A brokerage account can hold investments. A 401(k) is a workplace retirement account.", "type": "choice", "question": "Which account is offered through her employer?", "helper": ["401(k)", "Regular brokerage account"], "answer": "401(k)"}, {"mission": "m4", "title": "Roth vs. Traditional", "info": "One key difference is when tax benefits apply, though rules and eligibility vary.", "type": "choice", "question": "What question should she consider?", "helper": ["Pay taxes now or later?", "Which one guarantees an 8% return?"], "answer": "Pay taxes now or later?"}, {"mission": "m4", "title": "Target-date fund", "info": "A target-date fund typically adjusts its stock/bond mix as its target retirement year approaches.", "type": "choice", "question": "What makes it beginner-friendly?", "helper": ["It adjusts its mix over time", "It guarantees no losses"], "answer": "It adjusts its mix over time"}, {"mission": "m4", "title": "Social Security", "info": "Social Security is a government benefits program supported largely by payroll taxes from current workers.", "type": "choice", "question": "Is Social Security a personal investment account?", "helper": ["No", "Yes"], "answer": "No"}, {"mission": "m4", "title": "Investing under 18", "info": "A custodial brokerage account is owned by a minor and managed by an adult until the legal transfer age.", "type": "choice", "question": "Who manages a custodial account before the transfer age?", "helper": ["An adult custodian", "The minor entirely alone"], "answer": "An adult custodian"}, {"mission": "m5", "title": "Your advice: first steps", "info": "You have explored savings, diversification and retirement accounts.", "type": "write", "question": "What are the FIRST TWO things Jasmina should do?", "helper": "First, she should... Second, she should...", "answer": null}, {"mission": "m5", "title": "Your advice: investing", "info": "She thinks she needs to pick winning individual stocks.", "type": "write", "question": "Explain why a diversified low-cost fund could be a better starting point.", "helper": "I recommend... because...", "answer": null}, {"mission": "m5", "title": "Your advice: future", "info": "Think about investing regularly, checking fees and reviewing her goals.", "type": "write", "question": "What should Jasmina do next year as she learns more?", "helper": "Next year, she should...", "answer": null}, {"mission": "m5", "title": "Sources", "info": "Use two classroom-approved or reliable investing education sources, such as Investor.gov or your course materials.", "type": "write", "question": "List two sources you used.", "helper": "Source 1: ...\nSource 2: ...", "answer": null}];
const names={start:"Get Started",m1:"1 · Save",m2:"2 · Invest",m3:"3 · Market",m4:"4 · Retire",m5:"5 · Advise"};
const storage="investment_simple_v3";let state={};try{state=JSON.parse(localStorage.getItem(storage)||"{}")}catch(e){}let index=0;
function save(){localStorage.setItem(storage,JSON.stringify(state))}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const el=document.getElementById("screen");
 if(index>=steps.length){finish();return}
 const s=steps[index],value=state[index]??"";
 document.getElementById("count").textContent=`Question ${index+1} of ${steps.length}`;
 document.getElementById("mission").textContent=names[s.mission];
 document.getElementById("progress").style.width=`${Math.round(100*index/steps.length)}%`;
 let control="";
 if(s.type==="choice")control=`<div class="options">${s.helper.map(x=>`<button type="button" class="option ${value===x?"selected":""}" data-option="${safe(x)}">${safe(x)}</button>`).join("")}</div>`;
 else if(s.type==="write")control=`<textarea class="answer" id="response" placeholder="${safe(s.helper)}">${safe(value)}</textarea>`;
 else control=`<input class="answer" id="response" type="${s.type==="calc"?"number":"text"}" ${s.type==="calc"?'step="any" inputmode="decimal"':""} value="${safe(value)}" placeholder="${s.type==="calc"?"Type your answer here":"Type here"}">`;
 let helper=s.type==="calc"?`<div class="help"><b>Math helper</b><div class="math">${safe(s.helper)}</div><button class="secondary" id="showCalc" type="button">Show me the answer</button><div class="feedback" id="calcFeedback" aria-live="polite"></div></div>`:s.type==="write"?`<div class="help"><b>Writing tip:</b> Start with the sentence above. One or two clear sentences are enough.</div>`:"";
 el.innerHTML=`<h1>${safe(s.title)}</h1><p class="intro">${safe(s.info)}</p><div class="question">${safe(s.question)}</div>${control}${helper}<div class="buttons"><button class="secondary" id="back" ${index===0?"disabled":""}>← Back</button><button class="primary" id="next">${index===steps.length-1?"Finish →":"Next →"}</button></div><p class="tiny">Your answers save automatically on this browser. You can go back and change them.</p>`;
 document.getElementById("back").onclick=()=>{index=Math.max(0,index-1);render();scrollTo(0,0)};
 document.getElementById("next").onclick=()=>{index++;render();scrollTo(0,0)};
 if(s.type==="choice")el.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>{state[index]=b.dataset.option;save();el.querySelectorAll("[data-option]").forEach(c=>c.classList.toggle("selected",c===b))});
 else document.getElementById("response").addEventListener("input",e=>{state[index]=e.target.value;save()});
 if(s.type==="calc")document.getElementById("showCalc").onclick=()=>{
 const feedback=document.getElementById("calcFeedback");
 feedback.innerHTML=`Answer: <b>${safe(s.answer)}</b>. Look at the math above, then type this number into the box.`;
 feedback.className="feedback ok";
 };
}
function report(){
 let out="THE $10,000 INVESTMENT CHALLENGE — STUDENT REPORT\n\n";
 steps.forEach((s,i)=>{out+=`${names[s.mission]} | ${s.title}\n${s.question}\nAnswer: ${state[i]??"(not answered)"}\n\n`});
 out+="\nTEACHER RUBRIC (100 POINTS)\nMission 1: Savings, inflation, compounding — 15\nMission 2: Portfolio, diversification, fees — 25\nMission 3: Markets, profit, bonds — 20\nMission 4: Retirement and accounts — 15\nMission 5: Recommendations and sources — 25\n";
 return out;
}
function download(){const blob=new Blob([report()],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Investment_Challenge_Student_Report.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function finish(){
 document.getElementById("count").textContent="All questions";
 document.getElementById("mission").textContent="Finished";
 document.getElementById("progress").style.width="100%";
 const done=steps.filter((_,i)=>String(state[i]??"").trim()).length;
 document.getElementById("screen").innerHTML=`<h1>🎉 You're finished!</h1><p class="intro">You answered <b>${done} of ${steps.length}</b> questions. Download your report and turn it in on Google Classroom.</p><h2>100-point rubric</h2><table class="endtable"><tr><td>Save & compound growth</td><td>15</td></tr><tr><td>Invest & diversify</td><td>25</td></tr><tr><td>Market decisions & math</td><td>20</td></tr><tr><td>Retirement accounts</td><td>15</td></tr><tr><td>Client advice & sources</td><td>25</td></tr><tr><td><b>Total</b></td><td>100</td></tr></table><p class="tiny">Your teacher grades your explanations and choices. The website does not automatically assign a grade.</p><div class="buttons"><button class="secondary" id="review">← Review answers</button><button class="primary" id="download">⬇ Download report</button></div><p class="tiny">Saved only in this browser. Download before switching devices.</p>`;
 document.getElementById("review").onclick=()=>{index=steps.length-1;render()};
 document.getElementById("download").onclick=download;
}
render();
</script></body></html>
